<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A1A3F',
                        secondary: '#D4AF37',
                        accent: '#1E3A8A',
                        light: '#F8F9FC',
                        dark: '#0F172A'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #0A1A3F 0%, #0F2050 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white">

    <div class="w-full max-w-lg mx-auto p-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3 mb-4">
                <span class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-primary font-bold text-xl">IB</span>
                <span class="text-xl font-bold">Igreja Batista Nacional Diamantino</span>
            </a>
            <h1 class="text-3xl font-bold mt-6">Acesse sua Conta</h1>
            <p class="text-gray-300 mt-2">Entre na sua área de membro da IBN</p>
        </div>

        <div class="flex mb-6 bg-white/10 rounded-lg p-1">
            <span class="flex-1 text-center py-2 rounded-md bg-secondary text-primary font-bold">Entrar</span>
            <a href="cadastro.html" class="flex-1 text-center py-2 rounded-md text-gray-300 hover:text-white">Cadastrar</a>
        </div>

        <form id="formLogin" class="bg-white/10 backdrop-blur-sm p-6 rounded-xl shadow-xl space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com"
                    class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white outline-none focus:ring-2 focus:ring-secondary transition">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Senha</label>
                <div class="relative">
                    <input type="password" id="senha" required placeholder="Sua senha"
                        class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white outline-none focus:ring-2 focus:ring-secondary transition pr-12">
                    <button type="button" id="verSenha" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-white">
                        <i class="fa fa-eye"></i>
                    </button>
                </div>
            </div>

            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="lembrar" class="accent-secondary">
                <span>Lembrar de mim</span>
            </label>

            <button type="submit"
                class="w-full bg-secondary text-primary py-3 rounded-lg font-bold text-lg hover:bg-yellow-400 transition-colors mt-2">
                Entrar →
            </button>

            <p id="msgErro" class="text-red-400 text-center text-sm hidden mt-2"></p>
        </form>

        <p class="text-center mt-4 text-sm">
            <a href="#" id="linkRecuperar" class="text-gray-400 hover:text-secondary">Esqueceu a senha?</a>
        </p>
        <p class="text-center mt-6 text-sm text-gray-400">
            Não tem conta? <a href="cadastro.html" class="text-secondary font-bold hover:underline">Cadastre-se</a>
        </p>
        <p class="text-center mt-3">
            <a href="index.html" class="text-gray-400 text-sm hover:text-white">← Voltar para o site</a>
        </p>
    </div>

    <script src="conta.js"></script>
    <script>
        document.getElementById('verSenha').addEventListener('click', function() {
            const senha = document.getElementById('senha');
            const icone = this.querySelector('i');
            senha.type = senha.type === 'password' ? 'text' : 'password';
            icone.className = senha.type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
        });

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('msgErro');
            erro.classList.add('hidden');

            const resultado = fazerLogin(email, senha);
            if (!resultado.sucesso) {
                erro.textContent = resultado.mensagem;
                erro.classList.remove('hidden');
                return;
            }

            window.location.href = 'area-membro.html';
        });

        document.getElementById('linkRecuperar').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Enviamos um link de recuperação para o seu e-mail (simulado). Em breve com sistema completo!');
        });
    </script>
</body>
</html>
