<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A1A3F', secondary: '#D4AF37' } } } }
    </script>
    <style>
        .status-pendente { background: #FEF3C7; color: #92400E; }
        .status-pago { background: #D1FAE5; color: #065F46; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <script>
        const logado = sessionStorage.getItem('gestorLogado');
        if (!logado) {
            document.body.innerHTML = '<div class="text-center p-12"><p class="text-red-500 font-bold">Acesso restrito</p><a href="adminlogin.html" class="text-secondary">Fazer login</a></div>';
        }
    </script>

    <header class="bg-primary text-white p-4 shadow">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📋 Painel de Gestão — Inscrições</h1>
            <div>
                <span id="nomeGestor" class="text-sm mr-3"></span>
                <button id="btnSair" class="bg-white/20 px-3 py-1 rounded text-sm hover:bg-white/30">Sair</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <div class="grid md:grid-cols-3 gap-4">
                <div>
                    <label class="font-semibold text-sm">Filtrar por Evento</label>
                    <select id="filtroEvento" class="w-full p-2 border rounded mt-1">
                        <option value="todos">Todos</option>
                        <option value="retiro-2026">Retiro de Jovens 2026</option>
                        <option value="conferencia-2026">Conferência de Mulheres</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold text-sm">Filtrar por Status</label>
                    <select id="filtroStatus" class="w-full p-2 border rounded mt-1">
                        <option value="todos">Todos</option>
                        <option value="pago">✅ Pagos</option>
                        <option value="pendente">⏳ Pendentes</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold text-sm">Buscar por Nome</label>
                    <input type="text" id="buscaNome" placeholder="Digite o nome..." class="w-full p-2 border rounded mt-1">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-gray-500">Total Inscritos</p>
                <p id="resumoTotal" class="text-2xl font-bold text-primary">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-green-600">Pagos</p>
                <p id="resumoPagos" class="text-2xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-orange-500">Pendentes</p>
                <p id="resumoPendentes" class="text-2xl font-bold text-orange-500">0</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="p-3 text-left">Nome</th>
                        <th class="p-3 text-left">Evento</th>
                        <th class="p-3 text-left">Contato</th>
                        <th class="p-3 text-left">Valor</th>
                        <th class="p-3 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 text-center">
            <button id="btnExportar" class="bg-secondary text-primary px-6 py-2 rounded font-bold hover:bg-yellow-400">
                <i class="fa fa-download mr-2"></i> Exportar Lista
            </button>
        </div>
    </main>

    <script>
        const gestor = JSON.parse(sessionStorage.getItem('gestorLogado'));
        document.getElementById('nomeGestor').textContent = gestor.nome;

        document.getElementById('btnSair').addEventListener('click', () => {
            sessionStorage.removeItem('gestorLogado');
            window.location.href = 'adminlogin.html';
        });

        function carregarDados() {
            let todos = JSON.parse(localStorage.getItem('inscritosIBN') || '[]');
            
            const filEv = document.getElementById('filtroEvento').value;
            const filSt = document.getElementById('filtroStatus').value;
            const busca = document.getElementById('buscaNome').value.toLowerCase();

            let filtrado = todos;
            if (filEv !== 'todos') filtrado = filtrado.filter(i => i.eventoId === filEv);
            if (filSt === 'pago') filtrado = filtrado.filter(i => i.pago);
            if (filSt === 'pendente') filtrado = filtrado.filter(i => !i.pago);
            if (busca) filtrado = filtrado.filter(i => i.nome.toLowerCase().includes(busca));

            document.getElementById('resumoTotal').textContent = todos.length;
            document.getElementById('resumoPagos').textContent = todos.filter(i => i.pago).length;
            document.getElementById('resumoPendentes').textContent = todos.filter(i => !i.pago).length;

            const corpo = document.getElementById('tabelaCorpo');
            if (filtrado.length === 0) {
                corpo.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Nenhum registro encontrado</td></tr>';
                return;
            }
            corpo.innerHTML = filtrado.map(i => `
                <tr class="border-t hover:bg-gray-50">
                    <td class="p-3 font-semibold">${i.nome}<br><small class="text-gray-400">${i.codigo}</small></td>
                    <td class="p-3">${i.eventoNome}</td>
                    <td class="p-3 text-xs">${i.telefone || '-'}<br>${i.email || '-'}</td>
                    <td class="p-3">R$ ${i.valor.toFixed(2)}</td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-1 rounded-full text-xs font-bold ${i.pago ? 'status-pago' : 'status-pendente'}">
                            ${i.pago ? '✅ Pago' : '⏳ Pendente'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('filtroEvento').addEventListener('change', carregarDados);
        document.getElementById('filtroStatus').addEventListener('change', carregarDados);
        document.getElementById('buscaNome').addEventListener('input', carregarDados);

        document.getElementById('btnExportar').addEventListener('click', () => {
            const todos = JSON.parse(localStorage.getItem('inscritosIBN') || '[]');
            const cab = 'Nome;Evento;Telefone;Email;Valor;Status;Código;Data Inscrição\n';
            const linhas = todos.map(i => 
                `"${i.nome}";"${i.eventoNome}";"${i.telefone||''}";"${i.email||''}";${i.valor.toFixed(2)};${i.pago?'PAGO':'PENDENTE'};"${i.codigo}";"${i.dataInsc}"`
            ).join('\n');
            
            const blob = new Blob([cab + linhas], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inscritos-ibn-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.csv`;
            a.click();
        });

        carregarDados();
    </script>
</body>
</html>
